<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity_v1.0.1 (Remake)</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }
        body{
            background:#050816;
            color:white;
        }
        header{
            width:100%;
            padding:60px 20px 20px 20px;
            text-align:center;
            background:linear-gradient(
                90deg,
                #0f172a,
                #111827,
                #1e293b
            );
            border-bottom:2px solid #334155;
        }
        h1{
            font-size:3rem;
            color:#60a5fa;
            margin-bottom:35px;
        }
        .info-box{
            max-width:900px;
            margin:auto;
            background:#111827;
            border:1px solid #334155;
            border-radius:18px;
            padding:25px;
            text-align:left;
            box-shadow:0 0 15px rgba(0,0,0,0.35);
        }
        .info-box h2{
            color:#93c5fd;
            margin-bottom:18px;
            font-size:1.5rem;
        }
        .info-box ul{
            padding-left:25px;
            line-height:2;
            color:#cbd5e1;
        }
        .red-text{
            color:#ef4444;
            font-weight:bold;
        }
        .green-text{
            color:#22c55e;
            font-weight:700;
        }
        .download-section{
            margin-top:45px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:22px;
        }
        .download-btn{
            width:520px;
            max-width:90%;
            min-height:90px;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:20px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:20px;
            font-size:1.25rem;
            font-weight:bold;
            line-height:1.4;
            transition:0.2s;
            box-shadow:0 0 15px rgba(37,99,235,0.35);
        }
        .download-btn:hover{
            background:#3b82f6;
            transform:scale(1.04);
            box-shadow:0 0 25px rgba(59,130,246,0.45);
        }
        footer{
            text-align:center;
            padding:12px 20px 18px 20px;
            color:#94a3b8;
            border-top:1px solid #334155;
            margin-top:0px;
            font-size:1rem;
            line-height:1.8;
        }
        .credit{
            color:#64748b;
            font-size:0.95rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>
            Electricity_v1.0.1⚡(Remake) 
        </h1>
        <div class="info-box">
            <h2>
                Sửa cái đéo gì?
            </h2>
            <ul>
                <li class="red-text">
                    Solar panel, rtg và battery béo hơn
                    (do t thích🤣🤣🤣)
                </li>
                <li class="green-text">
                    ĐẶC BIỆT: ION ENGINE KHOẺ HƠN
                    VÀ ĐÉO CẦN FUEL
                </li>
            </ul>
        </div>

        <div class="download-section">
            <a href="./Electricity_v1.0.1.zip"
               class="download-btn"
               download>
                Electricity_v1.0.1 (Remake)
            </a>
        </div>
    </header>
    <footer>
        Lưu ý: Cần full bundle
        <div class="credit">
            Research & Concept & Design & Development by Kien
        </div>
    </footer>
</body>
</html>
